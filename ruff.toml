target-version = "py312"
line-length = 100
extend-exclude = ["tmp*"]

# The repository has substantial pre-existing style debt. Start with the
# reproducibility, integrity, and provider-free evaluation surface that CI
# actually exercises, and expand this list deliberately as legacy modules are
# touched. Keeping the scope explicit prevents a nominal gate that silently
# rewrites or blocks unrelated dirty-worktree code.
include = [
  "run_profile_ablation.py",
  "scripts/evidence_integrity_gate.py",
  "scripts/hard_case_subset_gate.py",
  "scripts/phase0_gate.py",
  "scripts/strict_observability_smoke.py",
  "src/evaluation/eval_bundle.py",
  "src/evaluation/evidence_integrity.py",
  "src/evaluation/offline_contract_runtime.py",
  "src/evaluation/profile_ablation.py",
  "src/evaluation/profile_runtime.py",
  "src/evaluation/run_identity.py",
]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# These executable entrypoints add the repository root to sys.path before
# importing project modules, so their imports intentionally follow bootstrap.
"run_profile_ablation.py" = ["E402"]
"scripts/evidence_integrity_gate.py" = ["E402"]
"scripts/hard_case_subset_gate.py" = ["E402"]

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
